name: Publish

# Publishes the extension to Open VSX when a GitHub release is published.
# The release tag must be the package.json version with a "v" prefix, e.g. v0.1.0.
on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write # to attach the .vsix to the release

jobs:
  publish:
    name: Publish to Open VSX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VERSION"
            exit 1
          fi
      # Type checks, lints, builds, and packages the .vsix.
      - run: npm run package
      - name: Check third-party notices are up to date
        run: git diff --exit-code ThirdPartyNotices.txt
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@1.4.0 publish file-navigator-*.vsix
      - name: Attach the .vsix to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" file-navigator-*.vsix
